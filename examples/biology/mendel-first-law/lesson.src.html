/* 豌豆植株：茎 + 叶 + 花 */
function plant(ctx, x, baseY, h, opts) {
  opts = opts || {};
  var color = opts.color || '#2f8f5b';
  var g = ctx.group('');
  var html = '<line x1="0" y1="0" x2="0" y2="' + (-h) + '" stroke="' + color + '" stroke-width="4" stroke-linecap="round"/>';
  var n = h > 120 ? 3 : 2;
  for (var i = 1; i <= n; i++) {
    var y = -h * i / (n + 1);
    html += '<path d="M0,' + y + ' q-30,-8 -44,-24 q24,-5 44,9" fill="' + color + '" opacity="0.72"/>';
    html += '<path d="M0,' + (y - 10) + ' q30,-8 44,-24 q-24,-5 -44,9" fill="' + color + '" opacity="0.72"/>';
  }
  html += '<circle cx="0" cy="' + (-h) + '" r="' + (h > 120 ? 10 : 6) + '" fill="#ffffff" stroke="' + color + '" stroke-width="2.5"/>';
  g.innerHTML = html;
  g.setAttribute('transform', 'translate(' + x + ',' + baseY + ') scale(1,0.001)');
  return g;
}
function grow(ctx, g, x, baseY, t0, dur) {
  ctx.tween(t0, dur, function (p) {
    g.setAttribute('transform', 'translate(' + x + ',' + baseY + ') scale(1,' + p.toFixed(4) + ')');
  }, 'out');
}
/* 等位基因徽章：显性实心，隐性空心 */
function allele(ctx, x, y, letter, t0) {
  var dominant = letter === letter.toUpperCase();
  var r = ctx.rect(x - 27, y - 31, 54, 62, {
    fill: dominant ? '#e8590c' : '#ffffff',
    stroke: '#a3400c', width: 2.6, rx: 10
  });
  var t = ctx.text(x, y + 11, letter, {
    size: 30, weight: 700, anchor: 'middle',
    fill: dominant ? '#ffffff' : '#a3400c', halo: false
  });
  if (t0 !== undefined) { ctx.fade(r, t0, 0.4); ctx.fade(t, t0 + 0.1, 0.4); }
  return { rect: r, text: t };
}
/* 2×2 棋盘 */
function punnett(ctx, opts) {
  var x = opts.x, y = opts.y, cw = opts.cw, ch = opts.ch;
  var cols = opts.cols, rows = opts.rows, combo = opts.combo;
  ctx.text(x + cw, y - 46, '雌配子', { size: 15, fill: '#5b6b80', anchor: 'middle' });
  ctx.text(x - 52, y + ch, '雄配子', { size: 15, fill: '#5b6b80', anchor: 'middle' }).setAttribute('transform', 'rotate(-90,' + (x - 52) + ',' + (y + ch) + ')');
  cols.forEach(function (c, j) {
    ctx.text(x + j * cw + cw / 2, y - 16, c, { size: 28, weight: 700, anchor: 'middle', fill: '#2f6fed' });
  });
  rows.forEach(function (r, i) {
    ctx.text(x - 24, y + i * ch + ch / 2 + 10, r, { size: 28, weight: 700, anchor: 'middle', fill: '#e8590c' });
  });
  var cells = [];
  for (var i = 0; i < rows.length; i++) {
    for (var j = 0; j < cols.length; j++) {
      var gx = x + j * cw, gy = y + i * ch;
      var bg = ctx.rect(gx, gy, cw, ch, { fill: '#ffffff', stroke: '#c9d4e2', width: 2, rx: 0 });
      var geno = combo(rows[i], cols[j]);
      var tall = geno.indexOf('dd') < 0;
      var tx = ctx.text(gx + cw / 2, gy + ch / 2 + 11, geno, {
        size: 27, weight: 700, anchor: 'middle', fill: tall ? '#0f6b3e' : '#a3400c', halo: false
      });
      cells.push({ bg: bg, t: tx, geno: geno, tall: tall });
    }
  }
  return cells;
}
