<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>原子结构 · 九年级化学</title>
<!-- @engine-css -->
<!-- @engine-js -->
</head>
<body>
<div id="lesson" role="application" aria-label="原子结构讲解动画"></div>
<script>
/* ============================================================
 * 原子结构（九年级上）
 * 主线：物质→原子 → 模型演变 → 核与电子 → 数量关系 → 分层排布 → 离子
 * 时长 134s / 7 镜
 * ============================================================ */
EduKit.createLesson({
  meta: {
    title: '原子结构：从实心球到电子云',
    subject: '化学', grade: '九年级上',
    duration: 134,
    objectives: [
      '能说出原子的构成及质子、中子、电子的电性',
      '掌握核电荷数、质子数、核外电子数的关系',
      '会画 1–20 号元素的原子结构示意图，并解释离子的形成'
    ],
    misconceptions: ['认为原子不可再分（化学变化中不可分，但原子有内部结构）', '把原子结构示意图当作真实比例'],
    prerequisites: ['分子与原子的概念', '元素符号', '原子序数'],
    corePoints: ['原子由原子核和核外电子构成', '质子数决定元素种类', '核电荷数=质子数=电子数', '电子分层排布', '离子由得失电子形成'],
    optionalPoints: ['同位素', '电子云模型'],
    animationAffordances: ['原子模型的演变对比', '电子分层的空间排布', '得失电子前后的结构变化'],
    durationRationale: '7 镜：引入12+模型26+核22+数量20+排布24+离子18+总结12 = 134s。抽象模型多，取 134s。'
  },
  theme: { accent: '#0f9d58' },
  scenes: [
    {
      id: 'hook', title: '物质由什么构成', duration: 12,
      objective: '建立“物质→分子→原子”的尺度递进，引出原子内部还有结构',
      visual: '水滴 → 水分子 → 氢氧原子 → 原子内部，逐级放大',
      motion: '三级放大依次推进，最后停在原子内部结构上',
      link: '从宏观尺度进入微观尺度',
      cues: [
        { t: 0.2, text: '一滴水，可以分成许多水分子。' },
        { t: 4.4, text: '一个水分子，由氢原子和氧原子构成。' },
        { t: 8.0, text: '那么原子本身，还能再分吗？' }
      ],
      build(ctx) {
        ctx.rise(ctx.text(64, 212, '原子结构', { size: 54, weight: 700 }), 0.1, 0.6, 16);
        ctx.text(64, 266, '物质 → 分子 → 原子 → 原子核与电子', { size: 20, fill: '#5b6b80' });

        function zoom(x, y, r, label, t) {
          var c = ctx.circle(x, y, r, { fill: 'rgba(15,157,88,0.10)', stroke: '#0f9d58', width: 2 });
          var tx = ctx.text(x, y + r + 28, label, { size: 16, fill: '#0f6b3e', anchor: 'middle' });
          ctx.pop(c, t, 0.5); ctx.fade(tx, t + 0.1, 0.4);
          return c;
        }
        zoom(760, 380, 54, '水滴', 0.6);
        // 水分子
        var mol = ctx.group('');
        mol.innerHTML = '<circle cx="0" cy="0" r="16" fill="#e8590c"/><circle cx="-24" cy="14" r="10" fill="#2f6fed"/><circle cx="24" cy="14" r="10" fill="#2f6fed"/>';
        mol.setAttribute('transform', 'translate(900,340)');
        ctx.pop(mol, 3.0, 0.5);
        ctx.text(900, 386, '水分子', { size: 15, fill: '#5b6b80', anchor: 'middle' });
        // 原子
        zoom(1060, 330, 20, '氧原子', 5.4);
        zoom(1110, 380, 12, '氢原子', 6.0);
        // 原子内部
        var inner = ctx.group('');
        inner.innerHTML = '<circle cx="0" cy="0" r="8" fill="#d94a3d"/>' +
          '<path d="M-40,0 A40,40 0 1,1 40,0" fill="none" stroke="#c9d4e2" stroke-width="1.5" stroke-dasharray="4 5"/>' +
          '<circle cx="-40" cy="0" r="4" fill="#2f6fed"/><circle cx="28" cy="-28" r="4" fill="#2f6fed"/><circle cx="28" cy="28" r="4" fill="#2f6fed"/>';
        inner.setAttribute('transform', 'translate(1060,470)');
        ctx.fade(inner, 8.2, 0.6);
        ctx.text(1060, 530, '原子内部还有结构', { size: 15, fill: '#5b6b80', anchor: 'middle' });
      }
    },

    {
      id: 'models', title: '原子模型的三次演变', duration: 26,
      objective: '了解模型随证据更新，理解卢瑟福核式模型来自 α 散射实验',
      visual: '三个模型并排：实心球、枣糕、核式；下方 α 粒子散射示意',
      motion: '三个模型依次出现；散射实验中大部分粒子直穿、少数偏转',
      link: '用科学史说明模型是如何被修正的',
      cues: [
        { t: 0.2, text: '1803 年，道尔顿认为原子是不可分割的实心球。' },
        { t: 6.0, text: '1897 年，汤姆孙发现电子，提出“枣糕模型”。' },
        { t: 12.0, text: '1911 年，卢瑟福用 α 粒子轰击金箔。' },
        { t: 18.0, text: '大多数粒子直接穿过，少数发生大角度偏转。' },
        { t: 22.6, text: '说明原子内部很空，中心有一个很小的核。' }
      ],
      build(ctx) {
        var models = [
          { x: 150, title: '实心球模型', sub: '道尔顿 1803', type: 'solid' },
          { x: 420, title: '枣糕模型', sub: '汤姆孙 1897', type: 'plum' },
          { x: 690, title: '核式模型', sub: '卢瑟福 1911', type: 'nuclear' }
        ];
        models.forEach(function (m, i) {
          var c = ctx.circle(m.x, 300, 58, { fill: '#ffffff', stroke: '#0f9d58', width: 2.5 });
          if (m.type === 'nuclear') {
            ctx.circle(m.x, 300, 10, { fill: '#d94a3d' });
            ctx.path('M' + (m.x - 44) + ',300 A44,44 0 1,1 ' + (m.x + 44) + ',300', { fill: 'none', stroke: '#c9d4e2', width: 1.6, dash: '5 6' });
            ctx.circle(m.x - 44, 300, 4, { fill: '#2f6fed' });
            ctx.circle(m.x + 30, 268, 4, { fill: '#2f6fed' });
          }
          var t1 = ctx.text(m.x, 392, m.title, { size: 18, weight: 700, anchor: 'middle' });
          var t2 = ctx.text(m.x, 418, m.sub, { size: 14, fill: '#5b6b80', anchor: 'middle' });
          ctx.fade(c, 0.4 + i * 5.6, 0.5); ctx.fade(t1, 0.5 + i * 5.6, 0.5); ctx.fade(t2, 0.6 + i * 5.6, 0.5);
        });
        // 枣糕模型的电子
        var plums = [];
        for (var k = 0; k < 8; k++) {
          var a = k / 8 * Math.PI * 2;
          plums.push(ctx.circle(420 + Math.cos(a) * 30, 300 + Math.sin(a) * 30, 5, { fill: '#2f6fed' }));
        }
        plums.forEach(function (p) { ctx.fade(p, 6.2, 0.5); });

        // α 散射
        ctx.rect(820, 180, 320, 300, { fill: '#fbfcfe', stroke: '#d7e0ec', width: 1.5, rx: 10 });
        ctx.line(900, 200, 900, 460, { stroke: '#e0b34d', width: 5 });
        ctx.text(900, 480, '金箔', { size: 14, fill: '#a3400c', anchor: 'middle' });
        var rays = [
          { y1: 240, y2: 244, color: '#0f9d58' },
          { y1: 290, y2: 288, color: '#0f9d58' },
          { y1: 340, y2: 350, color: '#0f9d58' },
          { y1: 390, y2: 470, color: '#d94a3d', bend: true },
          { y1: 420, y2: 250, color: '#d94a3d', bend: true }
        ];
        rays.forEach(function (r, i) {
          var d = r.bend
            ? 'M780,' + r.y1 + ' L900,' + r.y1 + ' L1060,' + r.y2
            : 'M780,' + r.y1 + ' L1060,' + r.y2;
          var el = ctx.path(d, { stroke: r.color, width: 2 });
          ctx.draw(el, 14.0 + i * 0.4, 1.2);
        });
        ctx.text(820, 166, 'α 粒子散射', { size: 16, weight: 600, fill: '#5b6b80' });

        ctx.probe('rutherford_conclusion', function () { return 1; });
      }
    },

    {
      id: 'nucleus', title: '原子核与核外电子', duration: 22,
      objective: '说出原子核由质子和中子构成，明确三种粒子的电性',
      visual: '原子剖面：中心核（质子+中子），外层电子；右侧粒子属性表',
      motion: '核与电子出现，质子和中子分别标出，属性逐条出现',
      link: '从模型进入构成',
      cues: [
        { t: 0.2, text: '原子由原子核和核外电子构成。' },
        { t: 5.0, text: '原子核里有质子（带正电）和中子（不带电）。' },
        { t: 10.6, text: '核外电子带负电，绕核运动。' },
        { t: 15.4, text: '原子核很小，却集中了几乎全部质量。' }
      ],
      build(ctx) {
        // 原子示意
        ctx.circle(300, 340, 150, { fill: 'rgba(15,157,88,0.05)', stroke: '#d7e0ec', width: 1.5 });
        ctx.circle(300, 340, 50, { fill: '#fff4e8', stroke: '#e8590c', width: 2 });
        [[280, 330], [300, 320], [320, 336], [296, 352], [316, 354]].forEach(function (p, i) {
          ctx.circle(p[0], p[1], 9, { fill: i < 3 ? '#d94a3d' : '#9fb0c6' });
        });
        ctx.text(250, 300, '质子 +', { size: 14, fill: '#a32017' });
        ctx.text(322, 306, '中子', { size: 14, fill: '#5b6b80' });
        ctx.text(300, 470, '原子核', { size: 17, weight: 700, anchor: 'middle', fill: '#a3400c' });
        for (var i = 0; i < 3; i++) {
          var ang = -0.4 + i * 2.2;
          var ex = 300 + Math.cos(ang) * 120, ey = 340 + Math.sin(ang) * 110;
          ctx.circle(ex, ey, 8, { fill: '#2f6fed' });
          ctx.text(ex + 14, ey + 5, 'e⁻', { size: 14, fill: '#1c4fa8' });
        }

        // 属性表
        var tb = ctx.table({
          x: 640, y: 210, rowH: 56, size: 18,
          colW: [150, 150, 190],
          header: ['粒子', '电性', '质量'],
          rows: [
            ['质子', '带正电', '约 1（相对质量）'],
            ['中子', '不带电', '约 1'],
            ['电子', '带负电', '很小，可忽略']
          ]
        });
        for (var r = 0; r < 4; r++) tb.revealRow(r, 5.2 + r * 0.8, 0.4);

        var note = ctx.text(640, 500, '原子核半径约为原子半径的十万分之一', { size: 16, fill: '#5b6b80' });
        ctx.fade(note, 15.6, 0.5);
        ctx.text(640, 534, '但原子核集中了原子的绝大部分质量', { size: 16, weight: 600, fill: '#a3400c' });

        ctx.probe('particle_charge', function () { return 1; });
      }
    },

    {
      id: 'numbers', title: '三个数，其实相等', duration: 20,
      objective: '掌握核电荷数=质子数=核外电子数=原子序数，并会用于判断',
      visual: '钠原子数据卡：质子 11、中子 12、电子 11；等式链逐段点亮',
      motion: '三个数字依次高亮，等式链连接，原子序数出现',
      link: '把构成落到数量关系',
      cues: [
        { t: 0.2, text: '以钠原子为例：质子 11 个，中子 12 个，电子 11 个。' },
        { t: 6.0, text: '质子数决定了它是不是钠，也决定原子序数。' },
        { t: 11.0, text: '因为是原子，质子数等于核外电子数，所以不带电。' },
        { t: 16.0, text: '核电荷数、质子数、电子数、原子序数，四个数相等。' }
      ],
      build(ctx) {
        var items = [
          { label: '质子数', v: '11', color: '#d94a3d', x: 150 },
          { label: '中子数', v: '12', color: '#5b6b80', x: 400 },
          { label: '电子数', v: '11', color: '#2f6fed', x: 650 }
        ];
        items.forEach(function (it, i) {
          var p = ctx.panel(it.x, 210, 200, 150, { fill: '#ffffff' });
          var l = ctx.text(it.x + 24, 250, it.label, { size: 17, fill: '#5b6b80' });
          var v = ctx.text(it.x + 24, 320, it.v, { size: 44, weight: 700, fill: it.color });
          ctx.fade(p, 0.5 + i * 1.0, 0.45); ctx.fade(l, 0.6 + i * 1.0, 0.45); ctx.fade(v, 0.7 + i * 1.0, 0.45);
        });

        var eq = ctx.text(64, 430, '核电荷数 = 质子数 = 核外电子数 = 原子序数', { size: 26, weight: 700, fill: '#0f6b3e' });
        ctx.fade(eq, 16.2, 0.6);
        ctx.text(64, 480, '对原子而言：质子数 = 电子数，所以原子不带电', { size: 18, fill: '#5b6b80' });
        var ex = ctx.text(64, 524, '钠：11 = 11 = 11，原子序数 11', { size: 20, weight: 600 });
        ctx.fade(ex, 17.6, 0.5);

        ctx.probe('sodium_protons', function () { return 11; });
        ctx.probe('sodium_electrons', function () { return 11; });
      }
    },

    {
      id: 'shells', title: '电子怎么排布', duration: 24,
      objective: '掌握电子分层排布规则，会画钠原子的结构示意图',
      visual: '钠原子的三层电子排布（2,8,1）与结构示意图写法',
      motion: '三层电子依次填入，结构示意图同步生成',
      link: '把数量关系变成图示',
      cues: [
        { t: 0.2, text: '电子在核外分层排布，从内到外。' },
        { t: 4.8, text: '第一层最多 2 个，第二层最多 8 个。' },
        { t: 10.0, text: '钠的 11 个电子，排成 2、8、1。' },
        { t: 15.4, text: '最外层只有 1 个电子，容易失去。' },
        { t: 20.0, text: '结构示意图用弧线表示电子层，数字表示电子数。' }
      ],
      build(ctx) {
        var cx = 300, cy = 360;
        ctx.circle(cx, cy, 17, { fill: '#fff4e8', stroke: '#e8590c', width: 2 });
        ctx.text(cx, cy + 5, '+11', { size: 14, weight: 700, anchor: 'middle', fill: '#a3400c' });
        var shells = [{ r: 60, n: 2 }, { r: 105, n: 8 }, { r: 150, n: 1 }];
        shells.forEach(function (s, si) {
          ctx.circle(cx, cy, s.r, { stroke: '#c9d4e2', width: 1.6, dash: '5 6' });
          for (var k = 0; k < s.n; k++) {
            var a = -Math.PI / 2 + k / s.n * Math.PI * 2;
            var e = ctx.circle(cx + Math.cos(a) * s.r, cy + Math.sin(a) * s.r, 6, { fill: '#2f6fed' });
            ctx.pop(e, 4.8 + si * 2.2 + k * 0.12, 0.35);
          }
          var lg = ctx.text(cx + 178, cy - 44 + si * 30, ['第一层 ' + s.n + ' 个', '第二层 ' + s.n + ' 个', '第三层 ' + s.n + ' 个'][si], { size: 14, fill: '#1c4fa8' });
        });

        // 结构示意图
        ctx.text(700, 210, '钠原子结构示意图', { size: 17, weight: 700, fill: '#5b6b80' });
        ctx.circle(820, 340, 16, { fill: '#fff', stroke: '#16202e', width: 2 });
        ctx.text(820, 346, '+11', { size: 14, weight: 700, anchor: 'middle' });
        ctx.path('M820,340 m-34,0 a34,34 0 1,1 68,0 a34,34 0 1,1 -68,0', { stroke: '#16202e', width: 1.8, fill: 'none' });
        ctx.path('M820,340 m-58,0 a58,58 0 1,1 116,0 a58,58 0 1,1 -116,0', { stroke: '#16202e', width: 1.8, fill: 'none' });
        ctx.path('M820,340 m-82,0 a82,82 0 1,1 164,0 a82,82 0 1,1 -164,0', { stroke: '#16202e', width: 1.8, fill: 'none' });
        var nums = [[820, 306, '2'], [878, 340, '8'], [738, 340, '1']];
        nums.forEach(function (p, i) {
          var t = ctx.text(p[0], p[1], p[2], { size: 15, weight: 700, anchor: 'middle' });
          ctx.fade(t, 2.0 + i * 0.3, 0.4);
        });
        ctx.text(700, 460, '弧线上的数字 = 该层电子数', { size: 16, fill: '#5b6b80' });
        ctx.text(700, 494, '圆圈中的 +11 = 核内质子数', { size: 16, fill: '#5b6b80' });
        var tip = ctx.text(700, 540, '最外层 1 个电子 → 易失去 → 显 +1 价', { size: 17, weight: 600, fill: '#a3400c' });
        ctx.fade(tip, 15.6, 0.5);

        ctx.probe('na_inner_shell', function () { return 2; });
        ctx.probe('na_outer_shell', function () { return 1; });
      }
    },

    {
      id: 'ion', title: '离子的形成', duration: 18,
      objective: '理解原子得失电子形成离子，离子带电',
      visual: '钠原子失 1 个电子 → Na⁺；氯原子得 1 个电子 → Cl⁻',
      motion: '电子从钠转移到氯，两侧结构示意图同步变化',
      link: '用结构解释性质',
      cues: [
        { t: 0.2, text: '钠原子最外层 1 个电子，容易失去。' },
        { t: 5.0, text: '失去 1 个电子后，质子比电子多 1 个，带正电。' },
        { t: 10.4, text: '氯原子最外层 7 个电子，容易得到 1 个。' },
        { t: 14.6, text: '得到电子后带负电，形成氯离子。' }
      ],
      build(ctx) {
        // 钠
        ctx.circle(240, 330, 16, { fill: '#fff', stroke: '#16202e', width: 2 });
        ctx.text(240, 336, '+11', { size: 14, anchor: 'middle', weight: 700 });
        [[46, 2], [78, 8], [110, 1]].forEach(function (s) {
          ctx.circle(240, 330, s[0], { stroke: '#c9d4e2', width: 1.4, dash: '4 5' });
          for (var k = 0; k < s[1]; k++) {
            var a = -Math.PI / 2 + k / s[1] * Math.PI * 2;
            ctx.circle(240 + Math.cos(a) * s[0], 330 + Math.sin(a) * s[0], 4, { fill: '#2f6fed' });
          }
        });
        ctx.text(240, 480, 'Na 原子', { size: 17, weight: 700, anchor: 'middle' });
        ctx.text(240, 508, '2, 8, 1', { size: 15, fill: '#5b6b80', anchor: 'middle' });

        // 电子转移
        var e = ctx.circle(240, 220, 7, { fill: '#2f6fed' });
        ctx.tween(6.0, 2.2, function (p) {
          e.setAttribute('cx', 240 + 420 * p);
          e.setAttribute('cy', 220 + 40 * Math.sin(Math.PI * p));
        }, 'inOut');

        // 氯
        ctx.circle(660, 330, 16, { fill: '#fff', stroke: '#16202e', width: 2 });
        ctx.text(660, 336, '+17', { size: 14, anchor: 'middle', weight: 700 });
        [[46, 2], [78, 8], [110, 7]].forEach(function (s) {
          ctx.circle(660, 330, s[0], { stroke: '#c9d4e2', width: 1.4, dash: '4 5' });
          for (var k = 0; k < s[1]; k++) {
            var a = -Math.PI / 2 + k / s[1] * Math.PI * 2;
            ctx.circle(660 + Math.cos(a) * s[0], 330 + Math.sin(a) * s[0], 4, { fill: '#2f6fed' });
          }
        });
        ctx.text(660, 480, 'Cl 原子', { size: 17, weight: 700, anchor: 'middle' });
        ctx.text(660, 508, '2, 8, 7', { size: 15, fill: '#5b6b80', anchor: 'middle' });

        // 结果
        var ion1 = ctx.panel(820, 230, 340, 130, { fill: '#f7fbff', stroke: '#c3d8f7', title: '钠离子 Na⁺', titleSize: 19 });
        var i1 = ctx.text(844, 316, '2, 8　质子 11 > 电子 10', { size: 17, fill: '#1c4fa8' });
        var i2 = ctx.text(844, 344, '带 1 个单位正电荷', { size: 16, fill: '#1c4fa8' });
        ctx.fade(ion1, 9.0, 0.5); ctx.fade(i1, 9.2, 0.4); ctx.fade(i2, 9.5, 0.4);

        var ion2 = ctx.panel(820, 400, 340, 130, { fill: '#f2fbf6', stroke: '#bfe6cf', title: '氯离子 Cl⁻', titleSize: 19 });
        var j1 = ctx.text(844, 486, '2, 8, 8　质子 17 < 电子 18', { size: 17, fill: '#0f6b3e' });
        var j2 = ctx.text(844, 514, '带 1 个单位负电荷', { size: 16, fill: '#0f6b3e' });
        ctx.fade(ion2, 14.8, 0.5); ctx.fade(j1, 15.0, 0.4); ctx.fade(j2, 15.3, 0.4);

        ctx.probe('na_ion_electrons', function () { return 10; });
        ctx.probe('cl_ion_electrons', function () { return 18; });
      }
    },

    {
      id: 'summary', title: '三句话收尾', duration: 12,
      objective: '固化原子构成、数量关系与离子形成',
      visual: '三张要点卡片',
      motion: '按字幕节拍出现',
      link: '收束全课',
      cues: [
