<div id="lesson" role="application" aria-label="质量守恒定律讲解动画"></div>
<script>
/* ============================================================
 * 质量守恒定律（九年级上）
 * 主线：蜡烛变短 → 两个定量实验 → 微观解释 → 方程式配平 → 解释开放体系 → 计算
 * 所有方程式均已配平，原子数前后一致
 * 时长 138s / 7 镜
 * ============================================================ */
EduKit.createLesson({
  meta: {
    title: '质量守恒定律：物质去哪了',
    subject: '化学', grade: '九年级上',
    duration: 138,
    objectives: [
      '能说出质量守恒定律的内容与适用范围',
      '能从原子种类、数目、质量不变解释守恒原因',
      '能判断开放体系中的“质量变化”是否违背定律'
    ],
    misconceptions: ['蜡烛燃烧后质量变小，说明物质消失了', '质量守恒对任何变化都成立（物理变化也常被混入）'],
    prerequisites: ['物质由粒子构成', '化学变化的本质是生成新物质', '常见元素符号'],
    corePoints: ['质量守恒定律的内容', '守恒的微观原因：原子三不变', '化学方程式配平的依据', '开放体系与密闭体系的区别'],
    optionalPoints: ['质量守恒与能量守恒的关系'],
    animationAffordances: ['原子重组过程的可视化', '反应前后原子计数表的同步变化', '开放/密闭体系的对比'],
    durationRationale: '7 镜：现象14+实验26+微观26+方程式22+解释22+计算16+总结12 = 138s。含微观解释与配平，中等偏复杂，取 138s。'
  },
  theme: { accent: '#0f9d58' },
  scenes: [
    {
      id: 'hook', title: '蜡烛越烧越短', duration: 14,
      objective: '用蜡烛变短的现象制造疑问：消失的质量去哪了',
      visual: '燃烧的蜡烛，烛身逐渐变短；旁边出现“质量去哪了”的问号',
      motion: '火焰摇曳，蜡烛高度缓慢下降，问号出现',
      link: '由现象引出质量去向问题',
      cues: [
        { t: 0.2, text: '一支蜡烛燃烧一段时间，明显变短了。' },
        { t: 4.6, text: '减少的那部分物质，去哪了？' },
        { t: 8.6, text: '是消失了，还是变成了别的东西？' },
        { t: 11.6, text: '先别猜，用天平来回答。' }
      ],
      build(ctx) {
        ctx.rise(ctx.text(64, 212, '质量守恒定律', { size: 52, weight: 700 }), 0.1, 0.6, 16);
        ctx.text(64, 266, '化学反应前后，物质的总质量会变吗？', { size: 21, fill: '#5b6b80' });

        // 蜡烛
        var body = ctx.rect(860, 330, 90, 190, { fill: '#fff6e8', stroke: '#d9b98c', width: 2, rx: 4 });
        ctx.line(905, 330, 905, 306, { stroke: '#5b6b80', width: 2 });
        var flame = ctx.group('');
        flame.innerHTML = '<path d="M0,0 C-16,-22 -10,-46 0,-62 C10,-46 16,-22 0,0 Z" fill="#ffb703" opacity="0.9"/>' +
          '<path d="M0,-8 C-7,-20 -4,-34 0,-44 C4,-34 7,-20 0,-8 Z" fill="#fff3c4"/>';
        flame.setAttribute('transform', 'translate(905,306)');
        ctx.tween(0.6, 1.0, function (p) { flame.setAttribute('opacity', p); });
        // 蜡烛变短
        ctx.tween(3.0, 9.0, function (p) {
          var h = 190 - 46 * p;
          body.setAttribute('y', 520 - h);
          body.setAttribute('height', h);
          flame.setAttribute('transform', 'translate(905,' + (520 - h - 24) + ')');
        }, 'linear');

        var q = ctx.text(1000, 300, '质量去哪了？', { size: 22, weight: 700, fill: '#d94a3d' });
        ctx.fade(q, 5.0, 0.5);
        ctx.text(64, 360, '提示：燃烧是化学变化', { size: 18, fill: '#5b6b80' });
        ctx.text(64, 400, '化学变化中，物质种类改变，但原子不会消失', { size: 18, fill: '#5b6b80' });
      }
    },

    {
      id: 'experiment', title: '两个定量实验', duration: 26,
      objective: '通过密闭体系实验看到反应前后总质量不变',
      visual: '左：密闭锥形瓶内红磷燃烧，放在天平上；右：铁钉插入硫酸铜溶液',
      motion: '天平示数出现，点燃后白烟生成，冷却后示数保持不变；右杯颜色变化但质量不变',
      link: '用实验事实回答“质量去哪了”',
      cues: [
        { t: 0.2, text: '第一个实验：锥形瓶里放红磷，瓶口系气球，整套放在天平上。' },
        { t: 6.0, text: '点燃红磷，产生大量白烟。' },
        { t: 11.4, text: '冷却后再称，质量没有变化。' },
        { t: 16.0, text: '第二个实验：铁钉放入硫酸铜溶液。' },
        { t: 20.4, text: '铁钉表面变红，溶液变色，总质量仍然不变。' }
      ],
      build(ctx) {
        // 左：锥形瓶 + 气球 + 天平
        ctx.line(120, 520, 520, 520, { stroke: '#9fb0c6', width: 4 });
        ctx.rect(210, 514, 180, 12, { fill: '#eef2f7', stroke: '#9fb0c6', width: 2, rx: 6 });
        ctx.path('M210,470 L390,470 L360,340 L240,340 Z', { fill: 'rgba(200,230,245,0.5)', stroke: '#7ba7c0', width: 2 });
        ctx.rect(240, 300, 120, 40, { fill: 'rgba(200,230,245,0.5)', stroke: '#7ba7c0', width: 2, rx: 4 });
        // 气球
        ctx.circle(300, 262, 30, { fill: 'rgba(255,183,3,0.18)', stroke: '#e8590c', width: 2 });
        ctx.text(300, 268, '气球', { size: 14, fill: '#a3400c', anchor: 'middle' });
        // 红磷
        var p4 = ctx.rect(270, 440, 60, 14, { fill: '#d94a3d', rx: 4 });
        ctx.text(300, 434, '红磷', { size: 14, fill: '#a32017', anchor: 'middle' });
        // 白烟
        var puffs = [[0, 0, 16], [-26, 10, 11], [24, 6, 12], [-12, -18, 9], [16, -20, 8], [2, 22, 10], [-32, -6, 7], [30, 22, 7]];
        puffs.forEach(function (q, i) {
          var s = ctx.circle(300 + q[0], 400 + q[1], q[2], { fill: '#ffffff', stroke: '#e3eaf3', width: 1, opacity: 0 });
          ctx.tween(6.2 + i * 0.16, 0.6, function (p) { s.setAttribute('opacity', p * 0.9); });
          ctx.tween(11.4 + i * 0.1, 0.8, function (p) { s.setAttribute('opacity', 0.9 * (1 - p)); });
        });
        // 天平示数
        var read = ctx.panel(420, 240, 200, 84, { fill: '#ffffff', stroke: '#9fb0c6' });
        var rt = ctx.text(520, 290, '100.0 g', { size: 26, weight: 700, fill: '#16202e', anchor: 'middle' });
        ctx.fade(read, 1.4, 0.5); ctx.fade(rt, 1.6, 0.5);
        var same = ctx.text(520, 344, '反应前后示数不变', { size: 15, fill: '#0f9d58', anchor: 'middle' });
        ctx.fade(same, 11.8, 0.5);

        // 右：铁钉 + 硫酸铜
        var beakerPath = ctx.path('M700,340 L700,470 L900,470 L900,340', { fill: 'rgba(80,160,220,0.25)', stroke: '#7ba7c0', width: 2 });
        ctx.line(700, 370, 900, 370, { stroke: '#4a90c2', width: 2 });
        ctx.text(716, 360, '硫酸铜溶液', { size: 15, fill: '#3b7ea8' });
        var nail = ctx.rect(790, 378, 12, 88, { fill: '#9fb0c6', rx: 3 });
        ctx.text(812, 372, '铁钉', { size: 15, fill: '#5b6b80' });
        ctx.tween(17.0, 3.0, function (p) {
          nail.setAttribute('fill', 'rgb(' + Math.round(159 - 60 * p) + ',' + Math.round(176 - 90 * p) + ',' + Math.round(198 - 120 * p) + ')');
        });
        // 溶液变浅绿
        ctx.tween(17.4, 3.4, function (p) {
          beakerPath.setAttribute('fill', 'rgba(' + Math.round(80 + 60 * p) + ',' + Math.round(160 + 20 * p) + ',' + Math.round(220 - 60 * p) + ',0.25)');
        });
        ctx.text(700, 520, '铁 + 硫酸铜 → 铜 + 硫酸亚铁', { size: 17, fill: '#5b6b80' });
        var rt2 = ctx.text(700, 552, '反应后总质量仍为 100.0 g', { size: 17, weight: 600, fill: '#0f9d58' });
        ctx.fade(rt2, 21.4, 0.5);

        ctx.text(64, 190, '实验事实', { size: 20, weight: 700, fill: '#5b6b80' });
        ctx.text(64, 574, '两次实验：反应前后总质量相等', { size: 17, fill: '#5b6b80' });
        ctx.probe('exp_balance', function () { return 100; });
      }
    },

    {
      id: 'micro', title: '微观：原子只是重新组合', duration: 26,
      objective: '从原子种类、数目、质量不变解释质量守恒',
      visual: '左侧反应前 4 个磷原子与 5 个氧分子；右侧反应后 2 个五氧化二磷分子',
      motion: '原子沿路径迁移重排，计数板数字保持不变',
      link: '从宏观事实进入微观解释',
      cues: [
        { t: 0.2, text: '化学变化的本质，是原子重新组合。' },
        { t: 4.6, text: '反应前有 4 个磷原子、10 个氧原子。' },
        { t: 10.0, text: '反应后，它们重新组合成 2 个五氧化二磷分子。' },
        { t: 15.6, text: '原子的种类没变，数目没变，质量也没变。' },
        { t: 21.0, text: '所以反应前后总质量必然相等。' }
      ],
      build(ctx) {
        var P0 = [[180, 280], [250, 280], [320, 280], [390, 280]];
        var O0 = [[160, 380], [220, 380], [280, 380], [340, 380], [400, 380],
                  [160, 440], [220, 440], [280, 440], [340, 440], [400, 440]];
        // 分子框：5 个 O2
        for (var i = 0; i < 5; i++) {
          (function (i) {
            var box = ctx.rect(140 + i * 60, 362, 52, 34, { fill: 'none', stroke: '#c9d4e2', width: 1.4, rx: 16 });
            ctx.tween(9.6, 0.8, function (p) { box.setAttribute('opacity', 1 - p); });
          })(i);
        }
        var pAtoms = P0.map(function (p, i) {
          var c = ctx.circle(p[0], p[1], 15, { fill: '#e8590c', stroke: '#a3400c', width: 2, opacity: 0 });
          ctx.fade(c, 1.0 + i * 0.12, 0.4);
          return c;
        });
        var oAtoms = O0.map(function (p, i) {
          var c = ctx.circle(p[0], p[1], 11, { fill: '#2f6fed', stroke: '#1c4fa8', width: 2 });
          ctx.fade(c, 1.6 + i * 0.08, 0.4);
          return c;
        });
        // 磷原子标签
        ctx.circle(150, 236, 8, { fill: '#e8590c' });
        ctx.text(166, 242, '磷原子', { size: 15, fill: '#a3400c' });
        ctx.circle(260, 236, 6, { fill: '#2f6fed' });
        ctx.text(276, 242, '氧原子（两个一组构成氧分子）', { size: 15, fill: '#1c4fa8' });

        // 右侧成品位置
        var g1 = [[840, 320], [880, 320], [810, 300], [910, 300], [810, 350], [910, 350], [860, 375]];
        var g2 = [[1060, 320], [1100, 320], [1030, 300], [1130, 300], [1030, 350], [1130, 350], [1080, 375]];
        var targets = [];
        // 每个 P2O5：2 个 P + 5 个 O
        var pi = 0, oi = 0;
        [g1, g2].forEach(function (g) {
          targets.push({ el: pAtoms[pi++], to: g[0] });
          targets.push({ el: pAtoms[pi++], to: g[1] });
          for (var k = 2; k < 7; k++) targets.push({ el: oAtoms[oi++], to: g[k] });
        });

        ctx.tween(9.6, 4.0, function (p) {
          targets.forEach(function (t) {
            var from = [parseFloat(t.el.getAttribute('cx')), parseFloat(t.el.getAttribute('cy'))];
            t.el.setAttribute('cx', from[0] + (t.to[0] - from[0]) * p);
            t.el.setAttribute('cy', from[1] + (t.to[1] - from[1]) * p);
          });
        }, 'inOut');

        // 左右标题与计数
        ctx.text(64, 200, '反应前', { size: 20, weight: 700, fill: '#5b6b80' });
        ctx.text(700, 200, '反应后', { size: 20, weight: 700, fill: '#5b6b80' });
        var after = ctx.text(700, 250, '2P₂O₅', { size: 26, weight: 700, fill: '#0f9d58' });
        var before = ctx.text(150, 330, '4P + 5O₂', { size: 22, weight: 600, fill: '#5b6b80' });
        ctx.fade(before, 14.0, 0.5);
        var moved = ctx.text(150, 368, '原子已重排到右侧', { size: 16, fill: '#5b6b80' });
        ctx.fade(moved, 14.0, 0.5);
        var arrow = ctx.arrow({ x1: 470, y1: 340, x2: 620, y2: 340, color: '#0f9d58', width: 2.5, t0: 13.4, dur: 0.6 });

        var tb = ctx.table({
          x: 64, y: 468, rowH: 34, size: 16,
          colW: [120, 120, 120, 120],
          header: ['原子', '反应前', '反应后', '结论'],
          rows: [['磷 P', '4', '4', '不变'], ['氧 O', '10', '10', '不变']]
        });
        for (var r = 0; r < 3; r++) tb.revealRow(r, 15.6 + r * 0.5, 0.35);

        ctx.probe('atom_count_P', function () { return 4; });
        ctx.probe('atom_count_O', function () { return 10; });
      }
    },

    {
      id: 'equation', title: '方程式为什么必须配平', duration: 22,
      objective: '理解配平的依据是原子守恒，学会用原子计数检查方程式',
      visual: '4P + 5O₂ →(点燃) 2P₂O₅ 与逐元素计数表',
      motion: '方程式出现，原子计数表逐行填入，未配平的错误写法对照',
      link: '把守恒用于化学用语',
      cues: [
        { t: 0.2, text: '红磷燃烧的方程式：4P 加 5O₂，点燃生成 2P₂O₅。' },
        { t: 5.4, text: '检查磷原子：左边 4 个，右边 2 乘 2 也是 4 个。' },
        { t: 10.6, text: '检查氧原子：左边 5 乘 2 是 10 个，右边 2 乘 5 也是 10 个。' },
        { t: 15.6, text: '如果不配平，两边原子数不等，就违背了质量守恒。' }
      ],
      build(ctx) {
        var eq = ctx.text(64, 210, '4P + 5O₂  →  2P₂O₅', { size: 38, weight: 700 });
        ctx.text(286, 162, '点燃', { size: 16, fill: '#a3400c' });
        ctx.fade(eq, 0.6, 0.6);

        var tb = ctx.table({
          x: 64, y: 260, rowH: 44, size: 19,
          colW: [150, 170, 170, 150],
          header: ['元素', '左边', '右边', '是否相等'],
          rows: [['P', '4', '2 × 2 = 4', '相等'], ['O', '5 × 2 = 10', '2 × 5 = 10', '相等']]
        });
        for (var r = 0; r < 3; r++) tb.revealRow(r, 5.6 + r * 0.7, 0.4);

        var p = ctx.panel(64, 420, 560, 120, { fill: '#fff6f5', stroke: '#f0c8c3' });
        var t1 = ctx.text(88, 456, '错误写法：P + O₂ → P₂O₅', { size: 21, color: '#a32017', fill: '#a32017' });
        var t2 = ctx.text(88, 492, '左边 1 个 P，右边 2 个 P，不守恒', { size: 17, fill: '#a32017' });
        ctx.fade(p, 16.0, 0.5); ctx.fade(t1, 16.2, 0.5); ctx.fade(t2, 16.6, 0.5);

        // 右侧原子示意
        ctx.text(760, 220, '配平的本质：两边原子一一对应', { size: 18, fill: '#5b6b80' });
        for (var i = 0; i < 4; i++) {
          ctx.circle(800 + i * 40, 290, 12, { fill: '#e8590c' });
        }
        ctx.text(960, 296, '4 个 P', { size: 17, fill: '#a3400c' });
        for (var j = 0; j < 10; j++) {
          ctx.circle(780 + j * 28, 350, 8, { fill: '#2f6fed' });
        }
        ctx.text(1064, 356, '10 个 O', { size: 17, fill: '#1c4fa8' });

        ctx.probe('balanced_P', function () { return 4; });
        ctx.probe('balanced_O', function () { return 10; });
      }
    },

    {
      id: 'explain', title: '蜡烛变轻，定律失效了吗', duration: 22,
      objective: '区分开放体系与密闭体系，纠正“物质消失”的错误',
      visual: '左：敞口燃烧，CO₂ 与水蒸气逸散；右：密闭容器，质量不变',
      motion: '敞口时气体分子飞出，总质量下降；密闭时气体被留住，示数不变',
      link: '回到开头的现象',
      cues: [
        { t: 0.2, text: '蜡烛燃烧生成二氧化碳和水蒸气。' },
        { t: 5.0, text: '敞口时，这些气体跑到空气里，称到的质量就变小了。' },
        { t: 10.6, text: '如果把这些气体也收集起来称，质量仍然相等。' },
        { t: 15.8, text: '所以定律没有失效，是我们漏称了气体。' }
      ],
      build(ctx) {
        ctx.text(64, 196, '开放体系 vs 密闭体系', { size: 20, weight: 700, fill: '#5b6b80' });

        // 左：敞口
        ctx.path('M120,320 L120,480 L340,480 L340,320', { fill: 'none', stroke: '#9fb0c6', width: 3 });
        ctx.circle(230, 470, 14, { fill: '#ffb703' });
        var gasColors = ['#8fa3bd', '#b7c7d8', '#9fb0c6'];
        for (var i = 0; i < 8; i++) {
          var g = ctx.circle(230 + (i % 3 - 1) * 40, 430 - Math.floor(i / 3) * 26, 7, { fill: gasColors[i % 3], opacity: 0 });
          (function (g, i) {
            ctx.tween(5.2 + i * 0.2, 0.5, function (p) { g.setAttribute('opacity', p * 0.9); });
            ctx.tween(7.0 + i * 0.2, 3.0, function (p) {
              g.setAttribute('cy', 430 - Math.floor(i / 3) * 26 - 120 * p);
              g.setAttribute('cx', 230 + (i % 3 - 1) * 40 + (i % 2 ? 20 : -20) * p);
              g.setAttribute('opacity', 0.9 * (1 - p * 0.8));
            }, 'out');
          })(g, i);
        }
        ctx.text(120, 520, '敞口：气体逸散，质量变小', { size: 17, fill: '#a32017' });
        ctx.text(120, 550, '减少的质量 = 逸散气体的质量', { size: 15, fill: '#5b6b80' });

        // 右：密闭
        ctx.rect(700, 300, 240, 200, { fill: 'rgba(200,230,245,0.25)', stroke: '#7ba7c0', width: 3, rx: 10 });
        ctx.circle(820, 470, 14, { fill: '#ffb703' });
        for (var k = 0; k < 6; k++) {
          ctx.circle(760 + (k % 3) * 50, 380 + Math.floor(k / 3) * 40, 6, { fill: '#8fa3bd', opacity: 0.7 });
        }
        ctx.text(700, 540, '密闭：气体被留住，质量不变', { size: 17, fill: '#0f6b3e' });
        ctx.text(700, 570, '反应前后总质量相等', { size: 15, fill: '#5b6b80' });

        var box = ctx.panel(64, 250, 560, 90, { fill: '#f2fbf6', stroke: '#bfe6cf' });
        var t = ctx.text(88, 306, '定律仍然成立，只是称量范围要包含所有物质', { size: 18, weight: 600, fill: '#0f6b3e' });
        ctx.fade(box, 15.8, 0.5); ctx.fade(t, 16.0, 0.5);

        ctx.probe('open_system', function () { return 0; });
      }
    },

    {
      id: 'calc', title: '用守恒做计算', duration: 16,
      objective: '用质量守恒进行简单计算，验证“反应物质量之和等于生成物质量”',
      visual: '碳燃烧的方程式与质量关系：12 + 32 = 44',
      motion: '方程式与质量数字依次出现，天平式等式收束',
      link: '把定律用于定量问题',
      cues: [
        { t: 0.2, text: '12 克碳在 32 克氧气中恰好完全燃烧。' },
        { t: 5.0, text: '生成多少克二氧化碳？' },
        { t: 8.6, text: '根据质量守恒，生成物总质量等于反应物总质量。' },
        { t: 12.2, text: '12 加 32 等于 44 克。' }
      ],
      build(ctx) {
        ctx.text(64, 206, 'C + O₂ → CO₂', { size: 34, weight: 700 });
