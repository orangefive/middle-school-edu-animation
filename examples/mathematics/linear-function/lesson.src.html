<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一次函数 y=kx+b 的图像与性质 · 八年级数学</title>
<!-- @engine-css -->
<!-- @engine-js -->
</head>
<body>
<div id="lesson" role="application" aria-label="一次函数图像与性质讲解动画"></div>
<script>
/* ============================================================
 * 一次函数 y=kx+b（八年级下）
 * 主线：匀速情境 → 解析式与直线 → k 的作用 → b 的作用 → 象限 → 读图
 * 时长 112s / 7 镜
 * ============================================================ */
EduKit.createLesson({
  meta: {
    title: '一次函数 y=kx+b 的图像与性质',
    subject: '数学', grade: '八年级下',
    duration: 112,
    objectives: [
      '能说出一次函数解析式与直线图像的对应关系',
      '能由 k 的符号判断增减性，由 |k| 判断倾斜程度',
      '能由 b 确定与 y 轴的交点，并判断图像经过的象限'
    ],
    misconceptions: ['把 b 当成斜率', '认为 k 越大直线越陡（应为 |k| 越大越陡）'],
    prerequisites: ['平面直角坐标系', '正比例函数 y=kx'],
    corePoints: ['一次函数图像是一条直线，两点确定', 'k 决定增减与倾斜程度', 'b 是与 y 轴交点的纵坐标', 'k、b 符号决定经过的象限'],
    optionalPoints: ['一次函数与方程、不等式的关系'],
    animationAffordances: ['同屏多条直线对比 k', '平行直线整体平移看 b', '图象与情境同步'],
    durationRationale: '7 镜：情境12+定义18+斜率20+截距16+象限18+读图16+总结12 = 112s。概念课，中等偏简单，取 112s。'
  },
  theme: { accent: '#2f6fed' },
  scenes: [
    {
      id: 'hook', title: '匀速行驶的路程', duration: 12,
      objective: '用匀速情境建立“路程随时间线性增长”的直觉',
      visual: '左侧情境文字与解析式；右侧 s-t 坐标系，直线随 time 生长',
      motion: '直线从原点向右上生长，末端出现移动的小车图标',
      link: '由真实情境引出一次函数',
      cues: [
        { t: 0.2, text: '一辆车以 60 千米每小时匀速行驶。' },
        { t: 4.4, text: '路程 s 与时间 t 的关系是 s = 60t。' },
        { t: 8.6, text: '图像是一条过原点的直线。' }
      ],
      build(ctx) {
        ctx.rise(ctx.text(64, 210, '一次函数', { size: 56, weight: 700 }), 0.1, 0.6, 16);
        ctx.rise(ctx.text(64, 268, 'y = kx + b   (k ≠ 0)', { size: 32, fill: '#2f6fed' }), 0.45, 0.6, 12);
        ctx.text(64, 322, '图像是一条直线，直线的“斜”和“位置”由 k、b 决定', { size: 18, fill: '#5b6b80' });

        var ax = ctx.axes({ x: [0, 6], y: [0, 360], box: { x: 700, y: 170, w: 460, h: 390 }, xStep: 1, yStep: 60, xLabel: 't/h', yLabel: 's/km' });
        ax.curve(function (t) { return 60 * t; }, { t0: 4.6, dur: 2.0, width: 3.4 });
        ax.point(4, 240, { label: '(4, 240)', t0: 8.0, dx: 10, dy: -12, color: '#0f9d58', size: 15 });
        ctx.probe('hook_slope', function () { return 60; });
      }
    },

    {
      id: 'definition', title: '解析式与直线一一对应', duration: 18,
      objective: '通过列表—描点确认一次函数图像是直线，并理解两点确定',
      visual: '左侧 y=2x+3 的数值表；右侧坐标系与直线、两个确定点',
      motion: '表格逐行出现，两点弹出后直线穿过两点生长',
      link: '把情境抽象成一般式',
      cues: [
        { t: 0.2, text: '以 y = 2x + 3 为例，列出几组对应值。' },
        { t: 5.0, text: '把点描出来，它们在同一条直线上。' },
        { t: 9.6, text: '一次函数的图像就是一条直线。' },
        { t: 13.4, text: '因此只要两个点，就能画出整条直线。' }
      ],
      build(ctx) {
        ctx.text(64, 190, 'y = 2x + 3', { size: 30, weight: 700 });
        var tb = ctx.table({
          x: 64, y: 224, rowH: 44, size: 19,
          colW: [70, 82, 82, 82, 82],
          header: ['x', '0', '1', '2', '3'],
          rows: [['y', '3', '5', '7', '9']]
        });
        tb.revealRow(0, 0.4, 0.4); tb.revealRow(1, 1.3, 0.4);
        ctx.text(64, 372, 'x 每增加 1，y 就增加 2', { size: 18, fill: '#5b6b80' });
        ctx.text(64, 408, '增量之比固定，图像才是直线', { size: 18, fill: '#5b6b80' });

        var ax = ctx.axes({ x: [-1, 4], y: [-1, 10], box: { x: 700, y: 168, w: 460, h: 392 }, xStep: 1, yStep: 2 });
        ax.point(0, 3, { label: '(0, 3)', t0: 5.0, dx: 10, dy: -12, size: 15 });
        ax.point(3, 9, { label: '(3, 9)', t0: 5.8, dx: -10, dy: -14, size: 15 });
        ax.curve(function (x) { return 2 * x + 3; }, { t0: 7.0, dur: 1.8, width: 3.4 });
        ctx.probe('def_value_at_3', function () { return 2 * 3 + 3; });
      }
    },

    {
      id: 'slope', title: 'k 决定增减与倾斜', duration: 20,
      objective: '由三条直线归纳 k>0 上升、k<0 下降、|k| 越大越陡',
      visual: '三条直线 y=2x、y=0.5x、y=−x+3 与图例',
      motion: '三条直线依次生长，k 的结论随图例出现',
      link: '从图像看参数',
      cues: [
        { t: 0.2, text: '三条直线的 k 不同，倾斜方向就不同。' },
        { t: 4.6, text: 'k 大于零，直线从左下到右上，y 随 x 增大而增大。' },
        { t: 10.6, text: 'k 小于零，直线从左上到右下，y 随 x 增大而减小。' },
        { t: 15.4, text: 'k 的绝对值越大，直线越陡。' }
      ],
      build(ctx) {
        var ax = ctx.axes({ x: [-4, 4], y: [-4, 6], box: { x: 700, y: 168, w: 460, h: 392 }, xStep: 1, yStep: 2 });
        ax.curve(function (x) { return 2 * x; }, { t0: 0.8, dur: 1.3, color: '#2f6fed', width: 3.2 });
        ax.curve(function (x) { return 0.5 * x; }, { t0: 2.0, dur: 1.3, color: '#0f9d58', width: 3.2 });
        ax.curve(function (x) { return -1 * x + 3; }, { t0: 4.8, dur: 1.3, color: '#e8590c', width: 3.2 });

        var lg = [['y = 2x    k = 2', '#2f6fed'], ['y = 0.5x   k = 0.5', '#0f9d58'], ['y = −x + 3   k = −1', '#e8590c']];
        lg.forEach(function (it, i) {
          var y = 220 + i * 46;
          var sw = ctx.line(84, y - 6, 118, y - 6, { stroke: it[1], width: 4 });
          var tx = ctx.text(132, y, it[0], { size: 20, weight: 600 });
          ctx.fade(sw, 1.2 + i * 0.6, 0.35); ctx.fade(tx, 1.2 + i * 0.6, 0.35);
        });
        var c1 = ctx.callout(84, 430, 'k > 0：上升', { color: '#0f9d58' });
        var c2 = ctx.callout(84, 486, 'k < 0：下降', { color: '#d94a3d' });
        var c3 = ctx.callout(84, 542, '|k| 越大越陡', { color: '#2f6fed' });
        ctx.fade(c1, 5.2, 0.45); ctx.fade(c2, 11.0, 0.45); ctx.fade(c3, 15.8, 0.45);

        ctx.probe('slope_sign', function () { return -1; });
      }
    },

    {
      id: 'intercept', title: 'b 决定直线与 y 轴的交点', duration: 16,
      objective: '理解 b 就是 x=0 时的函数值，即与 y 轴交点纵坐标',
      visual: '三条平行直线 y=2x−2、y=2x、y=2x+3 与三个交点',
      motion: '先画 y=2x，再上下平移得到另外两条，交点依次标出',
      link: '参数 b 的几何意义',
      cues: [
        { t: 0.2, text: '三条直线的 k 都是 2，所以互相平行。' },
        { t: 4.6, text: 'b 不同，直线与 y 轴交于不同位置。' },
        { t: 9.4, text: '令 x = 0，得到 y = b，交点就是 (0, b)。' }
      ],
      build(ctx) {
        var ax = ctx.axes({ x: [-3, 3], y: [-4, 7], box: { x: 700, y: 168, w: 460, h: 392 }, xStep: 1, yStep: 1 });
        ax.curve(function (x) { return 2 * x; }, { t0: 0.6, dur: 1.2, color: '#2f6fed', width: 3 });
        ax.curve(function (x) { return 2 * x + 3; }, { t0: 4.8, dur: 1.2, color: '#e8590c', width: 3 });
        ax.curve(function (x) { return 2 * x - 2; }, { t0: 6.2, dur: 1.2, color: '#0f9d58', width: 3 });
        ax.point(0, 0, { t0: 2.2, color: '#2f6fed', r: 5 });
        ax.point(0, 3, { label: '(0, 3)', t0: 8.0, dx: 10, dy: -10, color: '#e8590c', size: 15 });
        ax.point(0, -2, { label: '(0, −2)', t0: 8.8, dx: 10, dy: 20, color: '#0f9d58', size: 15 });

        ctx.text(64, 200, 'y = 2x + b', { size: 30, weight: 700 });
        ctx.text(64, 256, 'b = 3  →  向上平移 3 个单位', { size: 20, fill: '#e8590c' });
        ctx.text(64, 300, 'b = 0  →  过原点', { size: 20, fill: '#2f6fed' });
        ctx.text(64, 344, 'b = −2 →  向下平移 2 个单位', { size: 20, fill: '#0f9d58' });
        var box = ctx.panel(64, 400, 470, 110, { fill: '#f7fbff', stroke: '#c3d8f7' });
        var t = ctx.text(88, 444, 'b 就是 x = 0 时的函数值', { size: 21, weight: 700, fill: '#1c4fa8' });
        var t2 = ctx.text(88, 480, '所以交点坐标是 (0, b)', { size: 19, fill: '#1c4fa8' });
        ctx.fade(box, 9.6, 0.5); ctx.fade(t, 9.8, 0.5); ctx.fade(t2, 10.4, 0.5);

        ctx.probe('intercept_at_0', function () { return 3; });
      }
    },

    {
      id: 'quadrants', title: 'k、b 的符号与象限', duration: 18,
      objective: '由 k、b 的符号判断直线经过的象限，形成可查表的结论',
      visual: '左侧四种符号组合的结论表；右侧两条示例直线',
      motion: '表格逐行出现，示例直线同步生长',
      link: '把两个参数的作用合起来',
      cues: [
        { t: 0.2, text: 'k 和 b 的符号，共同决定直线经过哪些象限。' },
        { t: 5.0, text: 'k 大于零、b 大于零，经过第一、二、三象限。' },
        { t: 10.0, text: 'k 大于零、b 小于零，经过第一、三、四象限。' },
        { t: 14.6, text: 'k 小于零时，结论相应改变。' }
      ],
      build(ctx) {
        var rows = [
          ['k > 0，b > 0', '一、二、三'],
          ['k > 0，b < 0', '一、三、四'],
          ['k < 0，b > 0', '一、二、四'],
          ['k < 0，b < 0', '二、三、四']
        ];
        ctx.text(64, 186, '符号与象限', { size: 20, weight: 700, fill: '#5b6b80' });
        var tb = ctx.table({
          x: 64, y: 210, rowH: 52, size: 20,
          colW: [250, 250],
          header: ['k、b 的符号', '经过的象限'],
          rows: rows
        });
        for (var i = 0; i < 5; i++) tb.revealRow(i, 0.4 + i * 1.2, 0.35);

        var ax = ctx.axes({ x: [-3, 3], y: [-3, 5], box: { x: 760, y: 180, w: 400, h: 340 }, xStep: 1, yStep: 1, tickSize: 14 });
        ax.curve(function (x) { return 1.5 * x + 2; }, { t0: 5.2, dur: 1.2, color: '#2f6fed', width: 3 });
        ax.curve(function (x) { return -1.5 * x + 2; }, { t0: 10.4, dur: 1.2, color: '#e8590c', width: 3 });
        ctx.text(760, 552, '蓝：k>0, b>0　　橙：k<0, b>0', { size: 17, fill: '#5b6b80' });

        ctx.probe('quadrant_rule', function () { return 1; });
      }
    },

    {
      id: 'read', title: '从图像读出信息', duration: 16,
      objective: '把图像上的点与情境量对应，理解截距与斜率的实际含义',
      visual: '小明离家的路程—时间图像：起点 2 km，速度 6 km/h',
      motion: '图像生长，起点与某点标注，虚线辅助读数',
      link: '图像回到情境',
      cues: [
        { t: 0.2, text: '小明从离家 2 千米处出发，以 6 千米每小时前进。' },
        { t: 5.0, text: '图像与 y 轴交于 2，说明出发时已离家 2 千米。' },
        { t: 9.8, text: '斜率 6，表示每小时增加 6 千米。' },
        { t: 13.0, text: '解析式就是 s = 6t + 2。' }
      ],
      build(ctx) {
        var ax = ctx.axes({ x: [0, 5], y: [0, 35], box: { x: 700, y: 168, w: 460, h: 380 }, xStep: 1, yStep: 5, xLabel: 't/h', yLabel: 's/km' });
        ax.curve(function (t) { return 6 * t + 2; }, { t0: 0.8, dur: 1.8, color: '#0f9d58', width: 3.4 });
        ax.point(0, 2, { label: '(0, 2)', t0: 5.2, dx: 12, dy: 18, color: '#0f9d58', size: 15 });
        ax.point(3, 20, { label: '(3, 20)', t0: 9.8, dx: -10, dy: -14, color: '#0f9d58', size: 15 });
        ax.segment(0, 20, 3, 20, { color: '#9fb0c6', dash: '6 6', width: 1.4, t0: 10.6 });
        ax.segment(3, 0, 3, 20, { color: '#9fb0c6', dash: '6 6', width: 1.4, t0: 10.6 });

        ctx.text(64, 200, '图像读信息', { size: 20, weight: 700, fill: '#5b6b80' });
        ctx.text(64, 258, '起点 (0, 2)', { size: 24 });
        ctx.text(64, 306, '每小时增加 6 km', { size: 24 });
        var f = ctx.text(64, 380, 's = 6t + 2', { size: 34, weight: 700, fill: '#0f9d58' });
        ctx.fade(f, 13.4, 0.5);
        ctx.text(64, 434, 'b 是初始值，k 是变化率', { size: 18, fill: '#5b6b80' });

        ctx.probe('read_slope', function () { return 6; });
        ctx.probe('read_intercept', function () { return 2; });
      }
    },

    {
      id: 'summary', title: '三句话收尾', duration: 12,
      objective: '固化 k、b 的作用与图像读法',
      visual: '三张要点卡片',
      motion: '按字幕节拍出现',
      link: '收束全课',
      cues: [
        { t: 0.2, text: '一，图像是直线，两点就能确定。' },
        { t: 4.4, text: '二，k 管增减与陡缓，b 管与 y 轴的交点。' },
        { t: 8.4, text: '三，看图像先看交点，再看倾斜。' }
      ],
      build(ctx) {
        var items = [
          ['01', '图像', '一条直线，两点确定'],
          ['02', '参数', 'k 管增减与陡缓，b 管截距'],
          ['03', '读图', '先看与 y 轴交点，再看倾斜方向']
        ];
        items.forEach(function (it, i) {
          var y = 196 + i * 118;
          var card = ctx.panel(64, y, 1000, 96, {});
          var num = ctx.text(88, y + 56, it[0], { size: 30, weight: 700, fill: '#2f6fed' });
          var tt = ctx.text(158, y + 42, it[1], { size: 24, weight: 700 });
          var dd = ctx.text(158, y + 74, it[2], { size: 18, fill: '#5b6b80' });
          var rt = [0.3, 4.6, 8.6][i];
          ctx.fade(card, rt, 0.5); ctx.fade(num, rt, 0.5);
          ctx.fade(tt, rt + 0.1, 0.5); ctx.fade(dd, rt + 0.2, 0.5);
        });
      }
    }
  ]
});
</script>
</body>
</html>
