EduKit.createLesson({
  meta: {
    title: '串联与并联：两种连接方式',
    subject: '物理', grade: '九年级上',
    duration: 138,
    objectives: [
      '能识别串联与并联电路，说出电流路径的区别',
      '掌握串联的电流、电压、电阻规律',

    misconceptions: ['认为串联电压处处相等', '认为并联电流处处相等', '开关在并联中控制整个电路'],

  },
  theme: { accent: '#e8590c' },
  scenes: [
    {
      id: 'hook', title: '两个灯泡，两种接法', duration: 12,
      objective: '直观区分“一条路径”和“多条路径”两种连接',
      visual: '左右两个简单电路：串联一条回路，并联两条支路',
      motion: '先画串联，电流沿单一回路流动；再画并联，电流分成两支',
      link: '用路径差异定义两种连接',
      cues: [
        { t: 0.2, text: '两个灯泡，可以接成一条路径，也可以接成两条。' },
        { t: 4.8, text: '一条路径，叫串联；两条路径，叫并联。' },
        { t: 9.0, text: '区别的关键，是电流有没有分叉。' }
      ],
      build(ctx) {
        ctx.rise(ctx.text(64, 212, '串联与并联', { size: 54, weight: 700 }), 0.1, 0.6, 16);

        ctx.line(856, 512, 856, 528, { stroke: '#16202e', width: 2 });
        ctx.line(864, 520, 880, 520, { stroke: '#16202e', width: 4 });

      link: '先讲清串联的三条规律',
      cues: [
        { t: 0.2, text: '串联电路只有一条路径，电流处处相等。' },
        { t: 5.4, text: '所以 I = I₁ = I₂，流过每个用电器的电流都一样。' },
        { t: 10.6, text: '总电压等于各部分电压之和：U = U₁ + U₂。' },

        ctx.text(930, 548, '电源', { size: 15, fill: '#5b6b80', anchor: 'middle' });
        // 两个灯泡
        [[830, 240], [1040, 240]].forEach(function (p, i) {
          ctx.circle(p[0], p[1], 20, { fill: '#ffffff', stroke: '#16202e', width: 3 });

          var segs = [[0, 260], [260, 520], [520, 1440], [1440, 1700], [1700, 1960]];
          var d = t * 1960;
          if (d < 260) return [960 - d, 500];

        var l1 = ctx.text(64, 244, 'I = I₁ = I₂', { size: 28, weight: 700, fill: '#e8590c' });
        var l2 = ctx.text(64, 300, 'U = U₁ + U₂', { size: 28, weight: 700, fill: '#e8590c' });
        var l3 = ctx.text(64, 356, 'R = R₁ + R₂', { size: 28, weight: 700, fill: '#e8590c' });

      cues: [
        { t: 0.2, text: '并联电路中，电流从节点分成两条路径。' },
        { t: 5.6, text: '两条支路的两端都接在同一对节点上。' },

        ctx.text(64, 190, '两条支路，各走各的', { size: 20, weight: 700, fill: '#5b6b80' });
        var l1 = ctx.text(64, 250, 'U = U₁ = U₂', { size: 28, weight: 700, fill: '#0f9d58' });
        var l2 = ctx.text(64, 306, 'I = I₁ + I₂', { size: 28, weight: 700, fill: '#0f9d58' });
        var l3 = ctx.text(64, 362, '1/R = 1/R₁ + 1/R₂', { size: 26, weight: 700, fill: '#0f9d58' });
        ctx.fade(l1, 11.0, 0.5); ctx.fade(l2, 16.2, 0.5); ctx.fade(l3, 21.6, 0.5);
        var n1 = ctx.text(64, 424, '各支路互不影响，一条断路，另一条照常工作', { size: 17, fill: '#5b6b80' });

        ctx.fade(n2, 23.8, 0.5);

        ctx.probe('parallel_R', function () { return Math.round((1 / (1 / 10 + 1 / 20)) * 100) / 100; });
      }
    },

    {
      id: 'compare', title: '串并联对比', duration: 18,
      objective: '用一张表固化串并联在电流、电压、电阻、开关控制上的差异',
      visual: '四行对比表',
      motion: '表格逐行出现，关键差异高亮',
      link: '把两条规律并置记忆',
      cues: [
        { t: 0.2, text: '把两者放在一起看，差别很清楚。' },
        { t: 4.4, text: '串联电流相等、电压分配；并联电压相等、电流分配。' },
        { t: 10.0, text: '串联电阻相加，并联等效电阻更小。' },
        { t: 14.2, text: '串联开关控制全部，并联干路开关控制全部、支路开关只管自己。' }
      ],
      build(ctx) {
        var tb = ctx.table({
          x: 64, y: 190, rowH: 58, size: 19,
          colW: [200, 400, 400],
          header: ['比较项', '串联', '并联'],
          rows: [
            ['电流', '处处相等 I=I₁=I₂', '干路等于各支路之和 I=I₁+I₂'],
            ['电压', '总电压等于各部分之和', '各支路电压相等 U=U₁=U₂'],

        var tip = ctx.text(64, 540, '记忆抓手：串联“一条路”，并联“多条路”', { size: 22, weight: 700, fill: '#e8590c' });
        ctx.fade(tip, 15.0, 0.5);

        ctx.probe('compare_rule', function () { return 1; });
      }
    },

    {
      id: 'example', title: '串并联各算一次', duration: 26,
      objective: '用欧姆定律完成串并联计算，理解分压与分流',
      visual: '左：串联 6V、10Ω、20Ω；右：同样两电阻并联，数值对比',
      motion: '数值随计算步骤出现，电压/电流分配可视化',
      link: '规律用于计算',
      cues: [
        { t: 0.2, text: '两个电阻 10 欧和 20 欧，接在 6 伏电源上。' },
        { t: 4.6, text: '串联时总电阻 30 欧，电流 0.2 安。' },
        { t: 9.4, text: '电压按电阻分配：2 伏和 4 伏。' },
        { t: 14.4, text: '并联时电压都是 6 伏，电流分别是 0.6 安和 0.3 安。' },
        { t: 20.0, text: '干路电流 0.9 安，等效电阻约 6.7 欧。' }
      ],
      build(ctx) {
        ctx.text(64, 190, '串联', { size: 20, weight: 700, fill: '#2f6fed' });
        var s1 = ctx.text(64, 238, 'R = 10 + 20 = 30 Ω', { size: 23 });
        var s2 = ctx.text(64, 288, 'I = 6 ÷ 30 = 0.2 A', { size: 23 });
        var s3 = ctx.text(64, 338, 'U₁ = 0.2 × 10 = 2 V', { size: 23 });
        var s4 = ctx.text(64, 388, 'U₂ = 0.2 × 20 = 4 V', { size: 23 });
        ctx.fade(s1, 5.0, 0.4); ctx.fade(s2, 6.2, 0.4); ctx.fade(s3, 9.8, 0.4); ctx.fade(s4, 10.8, 0.4);

        ctx.text(64, 448, '并联', { size: 20, weight: 700, fill: '#0f9d58' });
        var p1 = ctx.text(64, 494, 'I₁ = 6 ÷ 10 = 0.6 A', { size: 23 });

        ctx.probe('example_series_I', function () { return 6 / (10 + 20); });
        ctx.probe('example_parallel_I', function () { return 6 / 10 + 6 / 20; });
      }
    },

    {
      id: 'identify', title: '怎么快速识别', duration: 16,
      objective: '掌握“从正极出发沿电流路径找分叉”的识别方法',
      visual: '三个电路小图，用高亮路径演示是否分叉',
      motion: '电流路径依次高亮：串联不分叉，并联在节点分叉',
      link: '方法收束',
      cues: [

        { t: 5.0, text: '中途没有分叉，就是串联。' },

        { t: 12.8, text: '注意：开关闭合前后，电路结构可能改变。' }
      ],
