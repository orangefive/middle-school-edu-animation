/* ============================================================
 * 光的折射（八年级上）
 * 主线：折断的筷子 → 实验光路 → 三条规律 → 光路可逆 → 池底变浅 → 叉鱼
 * 角度全部按 n=1.33 计算，保证光路自洽
 * 时长 132s / 7 镜
 * ============================================================ */
var N_WATER = 1.33;
function deg(d) { return d * Math.PI / 180; }
function rad(r) { return r * 180 / Math.PI; }
function refract(iDeg, fromN, toN) {
  return rad(Math.asin(Math.min(1, fromN / toN * Math.sin(deg(iDeg)))));
}
function n(v) { return Math.round(v * 100) / 100; }
function arcPath(cx, cy, r, a1, a2, steps) {
  var pts = [];
  steps = steps || 10;
  for (var i = 0; i <= steps; i++) {
    var a = (a1 + (a2 - a1) * i / steps) * Math.PI / 180;
    pts.push(n(cx + r * Math.cos(a)) + ',' + n(cy + r * Math.sin(a)));
  }
  return 'M' + pts.join(' L');
}
